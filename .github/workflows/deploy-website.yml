name: Deploy HotTea Website

on:
  push:
    branches:
      - main
    paths:
      - "hottea-website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify website
        run: test -f hottea-website/index.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: hottea-website

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

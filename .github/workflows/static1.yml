# Deploy the HotTea website to GitHub Pages
name: Deploy HotTea Website

on:
  push:
    branches: ["main"]
    paths:
      - "hottea-website/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./hottea-website"

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
